name: Verify native welcome motion
on:
  push:
    branches: [verify-welcome-motion]
permissions:
  contents: read
jobs:
  motion:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish desktop/native/Orbit.csproj -c Release -r win-x64 -p:StartupObject=Orbit.MotionProbe -o probe
      - shell: pwsh
        run: |
          $p = Start-Process probe/OrbitChat.exe -PassThru
          if (!$p.WaitForExit(45000)) { $p.Kill(); Write-Output '::error::Probe timed out'; throw 'Probe timed out' }
          if ($p.ExitCode -ne 0) { $detail = Get-Content motion-error.txt -First 1; Write-Output "::error::$detail"; throw $detail }
