name: Native Windows checks
on:
  workflow_dispatch:
  push:
    branches: [native-windows]
    paths: ['desktop/**', 'backend/**', '.github/workflows/windows-desktop.yml']
  pull_request:
    paths: ['desktop/**', 'backend/**', '.github/workflows/windows-desktop.yml']
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix backend
      - run: dotnet restore desktop/native-check/NativeCheck.csproj --locked-mode
      - name: Test chat and bidirectional native calls
        shell: pwsh
        run: |
          $relay = Start-Process node -ArgumentList 'backend/index.js' -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try { $ready = (Invoke-RestMethod 'http://127.0.0.1:4000/health').status -eq 'ok' } catch {}
              if ($ready) { break }
              Start-Sleep -Seconds 1
            }
            if (!$ready -or $relay.HasExited) { throw 'Test relay did not start.' }
            dotnet run --no-restore --project desktop/native-check
            if ($LASTEXITCODE -ne 0) { throw 'Native client integration checks failed.' }
          } finally { if (!$relay.HasExited) { $relay.Kill() } }
      - run: dotnet restore desktop/native/Orbit.csproj -r win-x64 --locked-mode
      - run: dotnet publish desktop/native/Orbit.csproj -c Release -r win-x64 --self-contained true --no-restore -o windows-build
      - name: Check the native window opens
        shell: pwsh
        run: |
          $app = Start-Process windows-build/OrbitChat.exe -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(30)
            do {
              Start-Sleep -Milliseconds 250
              $app.Refresh()
              if ($app.HasExited) { throw 'Orbit exited on startup.' }
            } until ($app.MainWindowTitle -eq 'Orbit Chat' -or (Get-Date) -gt $deadline)
            if ($app.MainWindowTitle -ne 'Orbit Chat') { throw 'Orbit window did not appear.' }
          } finally { if (!$app.HasExited) { $app.Kill() } }
      - name: Package the Windows application and its native runtime
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $crt = Get-Item "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT\vcruntime140.dll" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (!$crt) { throw 'Visual C++ x64 redistributable runtime missing.' }
          Copy-Item $crt.FullName windows-build
          python desktop/package-native.py windows-build orbit-native-windows-test.zip
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-native-windows-test-build
          path: orbit-native-windows-test.zip
