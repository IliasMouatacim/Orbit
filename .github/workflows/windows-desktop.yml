name: Native Windows checks
on:
  workflow_dispatch:
  push:
    branches: [native-windows]
    paths: ['desktop/**', 'backend/**', '.github/workflows/windows-desktop.yml']
  pull_request:
    paths: ['desktop/**', 'backend/**', '.github/workflows/windows-desktop.yml']
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix backend
      - run: dotnet restore desktop/native-check/NativeCheck.csproj --locked-mode
      - name: Test chat and bidirectional native calls
        shell: pwsh
        run: |
          $relay = Start-Process node -ArgumentList 'backend/index.js' -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try { $ready = (Invoke-RestMethod 'http://127.0.0.1:4000/health').status -eq 'ok' } catch {}
              if ($ready) { break }
              Start-Sleep -Seconds 1
            }
            if (!$ready -or $relay.HasExited) { throw 'Test relay did not start.' }
            dotnet run --no-restore --project desktop/native-check
            if ($LASTEXITCODE -ne 0) { throw 'Native client integration checks failed.' }
          } finally { if (!$relay.HasExited) { $relay.Kill() } }
      - run: dotnet restore desktop/native/Orbit.csproj -r win-x64 --locked-mode
      - run: dotnet publish desktop/native/Orbit.csproj -c Release -r win-x64 --self-contained true --no-restore -o windows-build
      - name: Check the native window opens
        shell: pwsh
        run: |
          $app = Start-Process windows-build/OrbitChat.exe -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(30)
            do {
              Start-Sleep -Milliseconds 250
              $app.Refresh()
              if ($app.HasExited) { throw 'Orbit exited on startup.' }
            } until ($app.MainWindowTitle -eq 'Orbit Chat' -or (Get-Date) -gt $deadline)
            if ($app.MainWindowTitle -ne 'Orbit Chat') { throw 'Orbit window did not appear.' }
          } finally { if (!$app.HasExited) { $app.Kill() } }
      - name: Package the Windows application and its native runtime
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $crt = Get-Item "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT\vcruntime140.dll" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (!$crt) { throw 'Visual C++ x64 redistributable runtime missing.' }
          Copy-Item $crt.FullName windows-build
          python desktop/package-native.py windows-build orbit-native-windows-test.zip
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-native-windows-test-build
          path: orbit-native-windows-test.zip
  sign:
    name: Sign Windows download
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: native
    runs-on: windows-2022
    environment: windows-signing
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: orbit-native-windows-test-build
      - name: Extract tested executable
        shell: pwsh
        run: |
          $zip = [IO.Compression.ZipFile]::OpenRead("$PWD/orbit-native-windows-test.zip")
          try {
            [IO.Compression.ZipFileExtensions]::ExtractToFile($zip.GetEntry('OrbitChat.exe'), "$PWD/OrbitChat.exe")
          } finally { $zip.Dispose() }
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files: ${{ github.workspace }}\OrbitChat.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Package and verify signed executable
        shell: pwsh
        run: |
          Copy-Item orbit-native-windows-test.zip orbit-chat-windows-x64.zip
          $zip = [IO.Compression.ZipFile]::Open("$PWD/orbit-chat-windows-x64.zip", 'Update')
          try {
            $zip.GetEntry('OrbitChat.exe').Delete()
            [void][IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zip, "$PWD/OrbitChat.exe", 'OrbitChat.exe')
          } finally { $zip.Dispose() }
          Expand-Archive orbit-chat-windows-x64.zip verified
          $signature = Get-AuthenticodeSignature verified/OrbitChat.exe
          if ($signature.Status -ne 'Valid' -or !$signature.TimeStamperCertificate) {
            throw "OrbitChat.exe must have a trusted, timestamped signature. Status: $($signature.Status)"
          }
          Write-Host "Verified publisher: $($signature.SignerCertificate.Subject)"
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-signed-windows-x64
          path: orbit-chat-windows-x64.zip
          if-no-files-found: error
